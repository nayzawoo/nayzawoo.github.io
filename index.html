    "content": "#!/bin/bash\n\n# omarchy:summary=List available themes\n# omarchy:examples=omarchy theme list | omarchy theme set \"Tokyo Night\"\n\n{\n  find ~/.config/omarchy/themes/ -mindepth 1 -maxdepth 1 \\( -type d -o -type l \\) -printf '%f\\n'\n  find \"$OMARCHY_PATH/themes/\" -mindepth 1 -maxdepth 1 -type d -printf '%f\\n'\n} | sort -u | sed -E 's/(^|-)([a-z])/\\1\\u\\2/g; s/-/ /g'\n"

    "path": "bin/omarchy-theme-set",
    "sha": "771df7fa40564f32d48b686fda268a39f444d563",
    "content": "#!/bin/bash\n\n# omarchy:summary=Apply an Omarchy theme\n# omarchy:args=\u003ctheme-name>\n# omarchy:examples=omarchy theme list | omarchy theme set \"Tokyo Night\"\n\nif [[ -z $1 ]]; then\n  echo \"Usage: omarchy-theme-set \u003ctheme-name>\"\n  exit 1\nfi\n\nCURRENT_THEME_PATH=\"$HOME/.local/state/omarchy/current/theme\"\nCURRENT_THEME_NAME_PATH=\"$HOME/.local/state/omarchy/current/theme.name\"\nNEXT_THEME_PATH=\"$HOME/.local/state/omarchy/current/next-theme\"\nCURRENT_BACKGROUND_LINK=\"$HOME/.local/state/omarchy/current/background\"\nTHEME_BACKGROUND_STATE_PATH=\"$HOME/.local/state/omarchy/theme-backgrounds\"\nBACKGROUND_TRANSITION_CACHE=\"$HOME/.cache/omarchy/background-transitions\"\nTHEME_SET_LOCK=\"${XDG_RUNTIME_DIR:-/tmp}/omarchy-theme-set.lock\"\nTHEME_SET_LOG=\"$HOME/.local/state/omarchy/theme-set.log\"\nTHEME_RETINT_LOCK=\"${XDG_RUNTIME_DIR:-/tmp}/omarchy-theme-set-retint.lock\"\nTHEME_GENERATION_PATH=\"$HOME/.local/state/omarchy/current/theme.generation\"\nUSER_THEMES_PATH=\"$HOME/.config/omarchy/themes\"\nOMARCHY_THEMES_PATH=\"$OMARCHY_PATH/themes\"\n\n# What a theme installed from a git repo may not ship, because these run code.\n# Hyprland requires a theme's hyprland.lua and gum_env.lua at login and Neovim\n# loads its neovim.lua at startup, so no .lua from such a theme is staged at all.\n# Each terminal config names the program the terminal launches, and vscode.json\n# names an extension omarchy-theme-set-vscode installs, a VS Code extension being\n# arbitrary JavaScript. Everything else a theme ships is colour and is kept.\n#\n# Adding a template for another terminal, or for another editor that loads Lua,\n# means adding it here. test/shell.d/theme-staging-test.sh fails on a generated\n# theme file that is neither denied here nor recorded there as colour-only.\nINSTALLED_THEME_DENIED=(alacritty.toml foot.ini ghostty.conf kitty.conf vscode.json)\nIGNORED_THEME_FILES=()\n\nFAILED_THEME_COMMANDS=()\n\n# Each command is an Omarchy command on the PATH this one already has, so it\n# runs directly rather than through a login shell that rereads the profile.\n# A background command would otherwise get /dev/null as stdin, and the browser\n# policy asks for a sudo password on stdin when it is a terminal.\nrun_parallel() {\n  local command index\n  local -a commands=(\"$@\") pids=()\n\n  for command in \"${commands[@]}\"; do\n    \"$command\" \u003c&0 8>&- &\n    pids+=(\"$!\")\n  done\n\n  for index in \"${!pids[@]}\"; do\n    wait \"${pids[$index]}\" || FAILED_THEME_COMMANDS+=(\"${commands[$index]}\")\n  done\n}\n\n# A retint that fails leaves one app on the old colours while the rest of the\n# desktop moved on. The switch itself still succeeded, so this never changes\n# the exit status. Name the command on stderr, and when that is the log a\n# detached run writes, in a notification too, since nobody is watching it.\nreport_failed_theme_commands() {\n  local detached=\"$1\"\n\n  (( ${#FAILED_THEME_COMMANDS[@]} > 0 )) || return 0\n\n  echo \"Theme retint failed: ${FAILED_THEME_COMMANDS[*]}\" >&2\n  if [[ $detached == \"detached\" ]]; then\n    omarchy-notification-send -u normal \"$(omarchy-i18n theme.notAppliedEverywhere)\" \\\n      \"$(omarchy-i18n theme.commandsFailed \"${FAILED_THEME_COMMANDS[*]}\" \"$THEME_SET_LOG\")\" >/dev/null 2>&1 || true\n  fi\n}\n\nshell_ipc() {\n  timeout 2 omarchy-shell \"$@\" >/dev/null 2>&1\n}\n\n# Wait, at most three seconds, while a shell call answers \u003cpending>.\nwait_for_theme_intro() {\n  local pending=\"$1\" deadline=$((SECONDS + 3))\n  shift\n  while (( SECONDS \u003c deadline )) && [[ $(omarchy-shell shell \"$@\" 2>/dev/null) == \"$pending\" ]]; do\n    sleep 0.02\n  done\n}\n\nis_video_path() {\n  [[ ${1,,} =~ \\.(mp4|m4v|mov|webm|mkv|avi)$ ]]\n}\n\nsnapshot_background_path() {\n  local background=\"$1\"\n  local name=\"$2\"\n  local snapshot extension\n\n  [[ -f $background ]] || return\n  is_video_path \"$background\" && return\n\n  mkdir -p \"$BACKGROUND_TRANSITION_CACHE\"\n  extension=${background##*.}\n  snapshot=\"$BACKGROUND_TRANSITION_CACHE/$name-$$.$extension\"\n  ln \"$background\" \"$snapshot\" 2>/dev/null || cp \"$background\" \"$snapshot\"\n  echo \"$snapshot\"\n}\n\nsnapshot_current_background() {\n  local current_background snapshot\n\n  # An interrupted intro is still moving; its final still would flash as a\n  # cover. Capture the frame already playing instead, when OWE supports it.\n  mkdir -p \"$BACKGROUND_TRANSITION_CACHE\"\n  snapshot=\"$BACKGROUND_TRANSITION_CACHE/previous-$$.ppm\"\n  if owe render \"$(jq -nc --arg path \"$snapshot\" '{cmd: \"snapshot\", path: $path}')\" >/dev/null 2>&1; then\n    echo \"$snapshot\"\n  else\n    current_background=$(readlink -f \"$CURRENT_BACKGROUND_LINK\" 2>/dev/null || true)\n    snapshot_background_path \"$current_background\" \"previous\"\n  fi\n}\n\ntheme_background_state_file() {\n  local theme=\"$1\"\n\n  [[ -n $theme && ${theme##*/} == $theme && $theme != \".\" && $theme != \"..\" ]] || return 1\n  printf '%s/%s\\n' \"$THEME_BACKGROUND_STATE_PATH\" \"$theme\"\n}\n\nremember_current_theme_background() {\n  local current_background state_file\n\n  state_file=$(theme_background_state_file \"$PREVIOUS_THEME_NAME\") || return\n  current_background=$(readlink -f \"$CURRENT_BACKGROUND_LINK\" 2>/dev/null || true)\n  [[ -f $current_background ]] || return\n\n  mkdir -p \"$THEME_BACKGROUND_STATE_PATH\"\n  printf '%s\\n' \"$current_background\" >\"$state_file\"\n}\n\nbackground_transition_uses_snapshots() {\n  local next_background=\"$1\"\n  local current_background\n\n  current_background=$(readlink -f \"$CURRENT_BACKGROUND_LINK\" 2>/dev/null || true)\n  ! is_video_path \"$current_background\" && ! is_video_path \"$next_background\"\n}\n\nchoose_theme_background() {\n  local theme_path=\"${1:-$CURRENT_THEME_PATH}\"\n  local current_theme_backgrounds=\"$CURRENT_THEME_PATH/backgrounds\"\n  local backgrounds=()\n  local current_background remembered_background state_file index next_index i\n\n  CHOSEN_THEME_BACKGROUND=\"\"\n  mapfile -d '' -t backgrounds \u003c \u003c(\n    find -L \"$HOME/.config/omarchy/backgrounds/$THEME_NAME/\" \"$theme_path/backgrounds/\" -maxdepth 1 -type f \\\n      \\( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.webp' \\\n         -o -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.mkv' -o -iname '*.avi' \\) \\\n      -print0 2>/dev/null | sort -z\n  )\n\n  (( ${#backgrounds[@]} > 0 )) || return 1\n\n  if [[ $PREVIOUS_THEME_NAME == \"$THEME_NAME\" ]]; then\n    current_background=$(readlink \"$CURRENT_BACKGROUND_LINK\" 2>/dev/null || true)\n    if [[ $theme_path != $CURRENT_THEME_PATH && ${current_background%/*} == $current_theme_backgrounds ]]; then\n      current_background=\"$theme_path/backgrounds/${current_background##*/}\"\n    fi\n\n    index=-1\n    for i in \"${!backgrounds[@]}\"; do\n      if [[ ${backgrounds[$i]} == $current_background ]]; then\n        index=$i\n        break\n      fi\n    done\n\n    if (( index != -1 )); then\n      next_index=$(((index + 1) % ${#backgrounds[@]}))\n      CHOSEN_THEME_BACKGROUND=\"${backgrounds[$next_index]}\"\n    else\n      CHOSEN_THEME_BACKGROUND=\"${backgrounds[0]}\"\n    fi\n    return\n  fi\n\n  state_file=$(theme_background_state_file \"$THEME_NAME\" 2>/dev/null || true)\n  remembered_background=$(cat \"$state_file\" 2>/dev/null || true)\n  if [[ $theme_path != $CURRENT_THEME_PATH && ${remembered_background%/*} == $current_theme_backgrounds ]]; then\n    remembered_background=\"$theme_path/backgrounds/${remembered_background##*/}\"\n  fi\n  if [[ -f $remembered_background ]]; then\n    CHOSEN_THEME_BACKGROUND=\"$remembered_background\"\n    return\n  fi\n\n  CHOSEN_THEME_BACKGROUND=\"${backgrounds[0]}\"\n}\n\nchoose_staged_theme_background() {\n  local next_theme_backgrounds=\"$NEXT_THEME_PATH/backgrounds\"\n\n  choose_theme_background \"$NEXT_THEME_PATH\" || return 1\n  STAGED_THEME_BACKGROUND=\"$CHOSEN_THEME_BACKGROUND\"\n\n  if [[ ${CHOSEN_THEME_BACKGROUND%/*} == $next_theme_backgrounds ]]; then\n    CHOSEN_THEME_BACKGROUND=\"$CURRENT_THEME_PATH/backgrounds/${CHOSEN_THEME_BACKGROUND##*/}\"\n  fi\n}\n\nset_theme_background_link() {\n  choose_theme_background || return 1\n  ln -nsf \"$CHOSEN_THEME_BACKGROUND\" \"$CURRENT_BACKGROUND_LINK\"\n}\n\nset_theme_background() {\n  local new_background new_background_snapshot theme_id intro_prepared=false\n\n  if [[ -z $CHOSEN_THEME_BACKGROUND || ! -f $CHOSEN_THEME_BACKGROUND ]]; then\n    if ! choose_theme_background; then\n      omarchy-notification-send \"$(omarchy-i18n theme.noBackground)\" -t 2000\n      shell_ipc shell applyTheme \"$colors_payload\" \"$shell_payload\" || true\n      return\n    fi\n  fi\n\n  new_background=\"$CHOSEN_THEME_BACKGROUND\"\n  if [[ $THEME_BACKGROUND_COVER == \"true\" ]]; then\n    if [[ -n $INTRO_PREPARE_PID ]] && wait \"$INTRO_PREPARE_PID\"; then\n      intro_prepared=true\n    fi\n    theme_id=$(stat -Lc '%d:%i' \"$CURRENT_THEME_PATH\")\n    # With its cover up, the shell takes the rest: the new still under the\n    # cover, the intro if there is one, the reveal with the new palette, and\n    # Hyprland's reload once no video plays, since a reload pauses video.\n    if shell_ipc shell prepareThemeIntro \"$OLD_BACKGROUND_SNAPSHOT\" \"$theme_id\" \"$colors_payload\" \"$shell_payload\"; then\n      ln -nsf \"$new_background\" \"$CURRENT_BACKGROUND_LINK\"\n      # The clip was found in the staged theme, which the swap renamed.\n      if shell_ipc shell playThemeIntro \"$theme_id\" \"$new_background\" \"${THEME_BACKGROUND_INTRO/#$NEXT_THEME_PATH\\//$CURRENT_THEME_PATH/}\" \"$intro_prepared\"; then\n        THEME_INTRO_TOKEN=\"$theme_id\"\n        return\n      fi\n      # A shell an update could not restart only knows to drop the cover.\n      shell_ipc shell finishThemeIntro \"$theme_id\" || true\n    fi\n  fi\n  new_background_snapshot=\"\"\n  if [[ -n $PREPARED_BACKGROUND_SNAPSHOT && $PREPARED_BACKGROUND == \"$new_background\" ]]; then\n    new_background_snapshot=\"$PREPARED_BACKGROUND_SNAPSHOT\"\n  else\n    [[ -z $PREPARED_BACKGROUND_SNAPSHOT ]] || rm -f \"$PREPARED_BACKGROUND_SNAPSHOT\"\n    if [[ $BACKGROUND_TRANSITION_SNAPSHOTS == \"true\" ]]; then\n      new_background_snapshot=$(snapshot_background_path \"$new_background\" \"next\")\n    fi\n  fi\n\n  if [[ -f $OLD_BACKGROUND_SNAPSHOT && -f $new_background_snapshot ]]; then\n    shell_ipc background themeTransition \"$OLD_BACKGROUND_SNAPSHOT\" \"$new_background_snapshot\" \"$new_background\" \"$colors_payload\" \"$shell_payload\" || \\\n      shell_ipc shell applyTheme \"$colors_payload\" \"$shell_payload\" || true\n    (sleep 3; rm -f \"$OLD_BACKGROUND_SNAPSHOT\" \"$new_background_snapshot\") &\n  elif [[ -f $new_background_snapshot ]]; then\n    shell_ipc background themeTransition \"\" \"$new_background_snapshot\" \"$new_background\" \"$colors_payload\" \"$shell_payload\" || \\\n      shell_ipc shell applyTheme \"$colors_payload\" \"$shell_payload\" || true\n    (sleep 3; rm -f \"$new_background_snapshot\") &\n  else\n    shell_ipc background themeTransition \"$OLD_BACKGROUND_SNAPSHOT\" \"$new_background\" \"$new_background\" \"$colors_payload\" \"$shell_payload\" || \\\n      shell_ipc shell applyTheme \"$colors_payload\" \"$shell_payload\" || true\n    if [[ -f $OLD_BACKGROUND_SNAPSHOT ]]; then\n      (sleep 3; rm -f \"$OLD_BACKGROUND_SNAPSHOT\") &\n    fi\n  fi\n\n  ln -nsf \"$new_background\" \"$CURRENT_BACKGROUND_LINK\"\n}\n\nis_denied_installed_file() {\n  local name=\"$1\"\n  local denied\n\n  [[ $name == *.lua ]] && return 0\n\n  for denied in \"${INSTALLED_THEME_DENIED[@]}\"; do\n    [[ $name == \"$denied\" ]] && return 0\n  done\n\n  return 1\n}\n\n# Themes older than colors.toml still get their palette, but their\n# alacritty.toml never reaches the staged theme: an Alacritty config names the\n# program the terminal launches.\nstage_installed_colors_from_alacritty() {\n  local source=\"$1\"\n  local scratch\n\n  if [[ -f $NEXT_THEME_PATH/colors.toml ]]; then\n    return\n  fi\n\n  if [[ ! -f $source/alacritty.toml || -L $source/alacritty.toml ]]; then\n    return\n  fi\n\n  scratch=$(mktemp -d)\n  cp \"$source/alacritty.toml\" \"$scratch/alacritty.toml\"\n  omarchy-theme-colors-from-alacritty \"$scratch\"\n\n  if [[ -f $scratch/colors.toml ]]; then\n    cp \"$scratch/colors.toml\" \"$NEXT_THEME_PATH/colors.toml\"\n  fi\n\n  rm -rf \"$scratch\"\n}\n\n# Copies a directory without ever following a symlink: in an installed theme one\n# points wherever the theme author chose, which is how an unlock.png becomes a\n# copy of any file the session can read.\nstage_installed_dir() {\n  local source=\"$1\"\n  local dest=\"$2\"\n  local entry name\n\n  mkdir -p \"$dest\"\n\n  for entry in \"$source\"/*; do\n    [[ -e $entry && ! -L $entry ]] || continue\n    name=${entry##*/}\n\n    if [[ -d $entry ]]; then\n      stage_installed_dir \"$entry\" \"$dest/$name\"\n    else\n      cp \"$entry\" \"$dest/$name\"\n    fi\n  done\n}\n\n# `omarchy theme install` clones into ~/.config/omarchy/themes, so a .git\n# directory there means the contents came from a stranger and are held to the\n# list above. A directory the user wrote themselves, and a symlink to their own\n# working copy, are theirs to fill however they like -- the same distinction\n# omarchy-theme-extras draws when it decides which themes it may pull.\ntheme_came_from_a_repo() {\n  local source=\"$1\"\n\n  [[ ! -L $source && -d $source/.git ]]\n}\n\nstage_installed_theme() {\n  local source=\"$1\"\n  local entry name\n\n  [[ -d $source ]] || return 0\n\n  for entry in \"$source\"/*; do\n    [[ -e $entry ]] || continue\n    name=${entry##*/}\n\n    if [[ -L $entry ]] || is_denied_installed_file \"$name\"; then\n      case \"${name,,}\" in\n        readme* | license* | changelog* | *.md | *.txt) ;;\n        *) IGNORED_THEME_FILES+=(\"$name\") ;;\n      esac\n    elif [[ -d $entry ]]; then\n      stage_installed_dir \"$entry\" \"$NEXT_THEME_PATH/$name\"\n    else\n      cp \"$entry\" \"$NEXT_THEME_PATH/$name\"\n    fi\n  done\n\n  stage_installed_colors_from_alacritty \"$source\"\n}\n\nreport_ignored_theme_files() {\n  (( ${#IGNORED_THEME_FILES[@]} > 0 )) || return 0\n\n  echo \"Ignored in $USER_THEMES_PATH/$THEME_NAME: ${IGNORED_THEME_FILES[*]}\" >&2\n  echo \"A theme installed from a git repo cannot supply Lua, a terminal config, or vscode.json.\" >&2\n}\n\nTHEME_NAME=$(echo \"$1\" | sed -E 's/\u003c[^>]+>//g' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')\nTHEME_HEADLESS=0\nif [[ ${OMARCHY_THEME_HEADLESS:-} == \"1\" || ${OMARCHY_THEME_OFFLINE:-} == \"1\" ]]; then\n  THEME_HEADLESS=1\nfi\n\nif [[ -z $THEME_NAME || $THEME_NAME == .* || $THEME_NAME == */* ]]; then\n  echo \"Invalid theme name: $1\"\n  exit 1\nfi\n\nif [[ ! -d $OMARCHY_THEMES_PATH/$THEME_NAME ]] && [[ ! -d $USER_THEMES_PATH/$THEME_NAME ]]; then\n  echo \"Theme '$THEME_NAME' does not exist\"\n  exit 1\nfi\n\n# Serialize theme changes. Theme switching rebuilds a shared next-theme staging\n# directory and updates current theme/background symlinks; concurrent calls can\n# otherwise race and make one selection appear to be ignored.\nexec 9>\"$THEME_SET_LOCK\"\nflock 9\n\n# A current video frame only represents the screen after its opening fade.\n# Finish that short reveal before capturing the next outgoing cover.\nif [[ $THEME_HEADLESS != \"1\" && $OMARCHY_THEME_SKIP_BACKGROUND != \"1\" ]]; then\n  wait_for_theme_intro pending themeIntroBusy\nfi\n\nPREVIOUS_THEME_NAME=$(cat \"$CURRENT_THEME_NAME_PATH\" 2>/dev/null || true)\nremember_current_theme_background\n\n# Setup clean next theme directory (for atomic theme config swapping)\nrm -rf \"$NEXT_THEME_PATH\"\nmkdir -p \"$NEXT_THEME_PATH\"\n\n# Copy official theme first, then overlay the user's theme on top\ncp -r \"$OMARCHY_THEMES_PATH/$THEME_NAME/\"* \"$NEXT_THEME_PATH/\" 2>/dev/null\n\nif theme_came_from_a_repo \"$USER_THEMES_PATH/$THEME_NAME\"; then\n  stage_installed_theme \"$USER_THEMES_PATH/$THEME_NAME\"\n  report_ignored_theme_files\nelse\n  cp -r \"$USER_THEMES_PATH/$THEME_NAME/\"* \"$NEXT_THEME_PATH/\" 2>/dev/null\nfi\n\n# Generate colors.toml from alacritty.toml if theme is missing colors.toml\nif [[ ! -f $NEXT_THEME_PATH/colors.toml && -f $NEXT_THEME_PATH/alacritty.toml ]]; then\n  omarchy-theme-colors-from-alacritty \"$NEXT_THEME_PATH\"\nfi\n\nCHOSEN_THEME_BACKGROUND=\"\"\nSTAGED_THEME_BACKGROUND=\"\"\nOLD_BACKGROUND_SNAPSHOT=\"\"\nPREPARED_BACKGROUND=\"\"\nPREPARED_BACKGROUND_SNAPSHOT=\"\"\nBACKGROUND_TRANSITION_SNAPSHOTS=true\nTHEME_BACKGROUND_INTRO=\"\"\nTHEME_BACKGROUND_COVER=false\nINTRO_PREPARE_PID=\"\"\nTHEME_INTRO_TOKEN=\"\"\nif [[ $THEME_HEADLESS != \"1\" && $OMARCHY_THEME_SKIP_BACKGROUND != \"1\" ]]; then\n  # Resolve the staged choice while the old theme still exists. Video changes\n  # switch directly to the durable path in QML, so neither side needs a copy.\n  if choose_staged_theme_background; then\n    # Reselecting the current theme cycles its background, which plays that\n    # background's intro like any other background change.\n    if [[ $PREVIOUS_THEME_NAME != \"$THEME_NAME\" || $(readlink \"$CURRENT_BACKGROUND_LINK\") != \"$CHOSEN_THEME_BACKGROUND\" ]] &&\n      [[ ! -f $HOME/.local/state/omarchy/toggles/background-intros-off ]] &&\n      [[ $(hyprctl -j getoption animations:enabled 2>/dev/null | jq -r '.bool') == \"true\" ]]; then\n      THEME_BACKGROUND_INTRO=$(omarchy-theme-bg-boot-intro --resolve-only \"$STAGED_THEME_BACKGROUND\")\n    fi\n    # An intro still playing hides the shell's background, so an ordinary\n    # transition would run unseen and end in a cut. Hold its current frame\n    # under the same cover instead and fade that out once OWE hands back.\n    if [[ -n $THEME_BACKGROUND_INTRO || $(owe status 2>/dev/null | jq -r '.intro' 2>/dev/null) == \"true\" ]]; then\n      THEME_BACKGROUND_COVER=true\n      OLD_BACKGROUND_SNAPSHOT=$(snapshot_current_background)\n      if [[ -n $THEME_BACKGROUND_INTRO ]]; then\n        # OWE retains the opened clip across the staged directory's rename.\n        owe intro-prepare \"$THEME_BACKGROUND_INTRO\" >/dev/null 2>&1 9>&- &\n        INTRO_PREPARE_PID=$!\n      fi\n      shell_ipc shell prepareThemeIntro \"$OLD_BACKGROUND_SNAPSHOT\" \"$(stat -Lc '%d:%i' \"$NEXT_THEME_PATH\")\" \"\" \"\" || true\n    elif background_transition_uses_snapshots \"$CHOSEN_THEME_BACKGROUND\"; then\n      OLD_BACKGROUND_SNAPSHOT=$(snapshot_current_background)\n\n      # Hand the shell the next background now, so it decodes while the\n      # templates render and the theme swaps in. The staged file is the same\n      # inode the swap moves into place, so its snapshot is the final image.\n      PREPARED_BACKGROUND=\"$CHOSEN_THEME_BACKGROUND\"\n      PREPARED_BACKGROUND_SNAPSHOT=$(snapshot_background_path \"$STAGED_THEME_BACKGROUND\" \"next\")\n      if [[ -n $PREPARED_BACKGROUND_SNAPSHOT ]]; then\n        shell_ipc background prepare \"$PREPARED_BACKGROUND_SNAPSHOT\" 9>&- &\n      fi\n    else\n      BACKGROUND_TRANSITION_SNAPSHOTS=false\n    fi\n  fi\nfi\n\n# Generate dynamic configs\nomarchy-theme-set-templates\n\n# Replacing the theme's still can cancel an active OWE intro even before the\n# background link changes. Present its cover before replacing either path.\nif [[ $THEME_BACKGROUND_COVER == \"true\" ]]; then\n  wait_for_theme_intro loading themeIntroCoverStatus \"$(stat -Lc '%d:%i' \"$NEXT_THEME_PATH\")\"\nfi\n\n# Swap next theme in as current\nrm -rf \"$CURRENT_THEME_PATH\"\nmv \"$NEXT_THEME_PATH\" \"$CURRENT_THEME_PATH\"\n# Name this switch, so its deferred retints can tell when a later one replaced\n# the theme. A directory's inode would do, except that it can be reused.\n# A token that could not be written proves nothing either way, so then the\n# retints run as if this switch were the latest.\nAPPLIED_THEME_GENERATION=\"$$-${EPOCHREALTIME//[!0-9]/}\"\nif ! printf '%s\\n' \"$APPLIED_THEME_GENERATION\" 2>/dev/null >\"$THEME_GENERATION_PATH\"; then\n  APPLIED_THEME_GENERATION=\"\"\nfi\n\n# Store theme name for reference\necho \"$THEME_NAME\" >\"$CURRENT_THEME_NAME_PATH\"\n\n# Make the running shell pick up the new palette immediately while the rest of\n# the theme hooks run.\ncolors_payload=$([[ -f $CURRENT_THEME_PATH/colors.toml ]] && base64 -w 0 \"$CURRENT_THEME_PATH/colors.toml\")\nshell_payload=$([[ -f $CURRENT_THEME_PATH/shell.toml ]] && base64 -w 0 \"$CURRENT_THEME_PATH/shell.toml\")\nif [[ $THEME_HEADLESS == \"1\" ]]; then\n  # No shell/session bus exists during ISO chroot finalization, but the first\n  # real login still needs a current background symlink for omarchy-shell to\n  # render.\n  [[ $OMARCHY_THEME_SKIP_BACKGROUND == \"1\" ]] || set_theme_background_link || true\nelif [[ $OMARCHY_THEME_SKIP_BACKGROUND == \"1\" ]]; then\n  shell_ipc shell applyTheme \"$colors_payload\" \"$shell_payload\" || true\nelse\n  set_theme_background\nfi\n\n# The shared staging/current symlinks are updated and the shell has accepted\n# the transition. Let another theme selection queue only behind that critical\n# section, not behind slower app-retint hooks and selector cache warmups.\nflock -u 9\n\n# What the user is looking at: the terminals and the programs drawn inside\n# them, plus the window borders when no intro is playing. These run as soon as\n# the theme is in place, alongside the wallpaper and bar transition.\nvisible_theme_commands=(\n  omarchy-restart-terminal\n  omarchy-theme-set-foot\n  omarchy-theme-set-tmux\n  omarchy-restart-btop\n  omarchy-restart-opencode\n  omarchy-restart-helix\n  omarchy-theme-set-hunk\n)\n\n# Configs other apps read on their next refresh or launch: GTK, the browser\n# policy, editors, agents and the keyboard backlight. Nothing on screen waits\n# for these.\nother_theme_commands=(\n  omarchy-theme-set-gnome\n  omarchy-theme-set-pi\n  omarchy-theme-set-claude\n  omarchy-theme-set-hermes\n  omarchy-theme-set-t3code\n  omarchy-theme-set-browser\n  omarchy-theme-set-vscode\n  omarchy-theme-set-obsidian\n  omarchy-theme-set-keyboard\n  omarchy-theme-set-fcitx5\n)\n\ntheme_still_current() {\n  [[ -z $APPLIED_THEME_GENERATION ]] && return 0\n  [[ $(\u003c\"$THEME_GENERATION_PATH\") == \"$APPLIED_THEME_GENERATION\" ]] 2>/dev/null\n}\n\napply_other_theme_commands() {\n  local detached=\"${1:-}\"\n\n  # Let an intro's wallpaper and bar finish their reveal before these compete\n  # with video decoding and the shell's frame rendering.\n  if [[ -n $THEME_INTRO_TOKEN ]]; then\n    wait_for_theme_intro pending themeIntroStatus \"$THEME_INTRO_TOKEN\"\n  fi\n\n  # Warm the background selector's thumbnails, which converts images on every\n  # core, so it too waits for the reveal. The theme picker keeps its own rows\n  # in the shell and refreshes them each time it opens.\n  omarchy-theme-bg-cache \u003c/dev/null >/dev/null 2>&1 8>&- 9>&- &\n\n  # Quick switches leave several of these batches going, and a retint such as\n  # the browser's reads its colour long before it writes it. Run the batches\n  # one at a time, and skip the retints of one whose theme was replaced while\n  # it waited, so an older theme never lands after a newer one.\n  exec 8>\"$THEME_RETINT_LOCK\"\n  flock 8\n  local current=false\n  if theme_still_current; then\n    current=true\n  fi\n\n  # The log starts over with each batch that retints, and a superseded one\n  # leaves it to the newer batch. An older batch's hook may still be writing to\n  # it, so every batch appends rather than writing at its own offset.\n  if [[ $detached == \"detached\" ]]; then\n    if [[ $current == \"true\" ]]; then\n      : >\"$THEME_SET_LOG\"\n    fi\n    exec 2>>\"$THEME_SET_LOG\"\n  fi\n  if [[ $current == \"true\" ]]; then\n    run_parallel \"${other_theme_commands[@]}\"\n  fi\n  exec 8>&-\n\n  # Call hook on theme set. The lock is released first: a hook may switch the\n  # theme itself, and that switch's batch needs the lock.\n  omarchy-hook theme-set \"$THEME_NAME\" >/dev/null\n\n  # A newer switch replaced this theme during the hook, so its failures say\n  # nothing about the apps any more; the newer batch reports its own.\n  if theme_still_current; then\n    report_failed_theme_commands \"$detached\"\n  fi\n}\n\nif [[ $THEME_HEADLESS != \"1\" ]]; then\n  # An intro reloads Hyprland after playback; ordinary theme changes reload it\n  # with the terminals.\n  if [[ -z $THEME_INTRO_TOKEN ]]; then\n    visible_theme_commands+=(omarchy-restart-hyprctl)\n  fi\n  run_parallel \"${visible_theme_commands[@]}\"\n\n  # A switch from the theme picker, the menu or a script returns once what is\n  # on screen has changed and leaves the rest running behind it, with its\n  # output in the log. One typed in a terminal waits for everything, so the\n  # browser policy can ask for a sudo password there, and so does a caller\n  # that sets OMARCHY_THEME_WAIT=1 because it reads those app configs next.\n  if [[ -t 0 || ${OMARCHY_THEME_WAIT:-} == \"1\" ]]; then\n    apply_other_theme_commands\n  else\n    mkdir -p \"${THEME_SET_LOG%/*}\"\n    apply_other_theme_commands detached \u003c/dev/null >/dev/null 2>/dev/null 9>&- &\n  fi\n\n  # Mirror the theme to herdr machines. SSH can take a while, so this never holds up the theme change.\n  setsid omarchy-theme-set-herdr-machines >>\"$HOME/.local/state/omarchy/theme-set-herdr-machines.log\" 2>&1 \u003c/dev/null &\nfi\n"
  }
]
</script>
  <script>
    'use strict';
    (() => {
      const canvas = document.getElementById('code');
      const context = canvas.getContext('2d');
      if (!context) return;
      const files = JSON.parse(document.getElementById('omarchy-source').textContent);
      const scrollSpace = document.getElementById('scroll-space');
      const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
      const font = '13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      const lineHeight = 23;
      const topPadding = 48;
      const leftPadding = 28;
      const gutter = 54;
      const radius = 145;
      const zoom = 1.85;
      let width = 0;
      let height = 0;
      let rows = [];
      let frame = 0;
      const pointer = { x: 0, y: 0, active: false };

      function scheduleDraw() {
        if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); });
      }

      function layout() {
        width = document.documentElement.clientWidth;
        height = window.innerHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.font = font;
        const columns = Math.max(12, Math.floor((width - leftPadding * 2 - gutter) / context.measureText('M').width));
        rows = [];
        for (const file of files) {
          rows.push({ number: '', text: '# omacom/omarchy / ' + file.path, header: true });
          file.content.replace(/\n$/, '').split('\n').forEach((line, index) => {
            const expanded = line.replace(/\t/g, '  ');
            if (!expanded) rows.push({ number: index + 1, text: '' });
            for (let offset = 0; offset < expanded.length; offset += columns) {
              rows.push({ number: offset === 0 ? index + 1 : '·', text: expanded.slice(offset, offset + columns) });
            }
          });
          rows.push({ number: '', text: '' }, { number: '', text: '' });
        }
        scrollSpace.style.height = Math.max(height * 2, rows.length * lineHeight + topPadding * 2) + 'px';
        scheduleDraw();
      }

      function paintCode(bright) {
        const scroll = window.scrollY;
        const start = Math.max(0, Math.floor((scroll - topPadding) / lineHeight) - 2);
        const end = Math.min(rows.length, Math.ceil((scroll + height - topPadding) / lineHeight) + 2);
        context.font = font;
        context.textBaseline = 'top';
        for (let index = start; index < end; index++) {
          const row = rows[index];
          const y = topPadding + index * lineHeight - scroll;
          context.fillStyle = bright ? '#58677c' : '#253243';
          context.textAlign = 'right';
          context.fillText(String(row.number), leftPadding + gutter - 18, y);
          context.textAlign = 'left';
          const text = row.text.trimStart();
          context.fillStyle = row.header ? (bright ? '#e0af68' : '#60503b')
            : text.startsWith('#') ? (bright ? '#789176' : '#34463e')
            : /^(if|then|fi|else|elif|for|do|done|while|return|local|function)\b/.test(text) ? (bright ? '#bb9af7' : '#47465f')
            : (bright ? '#a9c5de' : '#3c4d60');
          context.fillText(row.text, leftPadding + gutter, y);
        }
      }

      function draw() {
        context.fillStyle = '#0b1017';
        context.fillRect(0, 0, width, height);
        paintCode(false);
        if (!pointer.active || !finePointer.matches) return;
        const { x, y } = pointer;
        context.save();
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.clip();
        context.fillStyle = '#101923';
        context.fillRect(0, 0, width, height);
        context.translate(x, y);
        context.scale(zoom, zoom);
        context.translate(-x, -y);
        paintCode(true);
        context.restore();
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.strokeStyle = '#91afc044';
        context.lineWidth = 1;
        context.stroke();
      }

      window.addEventListener('pointermove', event => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.active = event.pointerType !== 'touch';
        scheduleDraw();
      }, { passive: true });
      function hideLens() { pointer.active = false; scheduleDraw(); }
      document.documentElement.addEventListener('pointerleave', hideLens);
      window.addEventListener('blur', hideLens);
      window.addEventListener('pointerdown', event => { if (event.pointerType === 'touch') hideLens(); }, { passive: true });
      window.addEventListener('scroll', scheduleDraw, { passive: true });
      window.addEventListener('resize', layout, { passive: true });
      finePointer.addEventListener('change', hideLens);
      layout();
    })();
  </script>
