dim);text-decoration:none}a:hover{color:var(--blue)}@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}aside{display:none}.sidebar-open aside{display:block;position:absolute;inset:36px auto 52px 0;width:250px;z-index:4;box-shadow:20px 0 60px #0008}.titlebar{padding:0 8px}.titlebar .title{font-size:11px}.titlebar .local-note{display:none}.encoding,.status-branch,.hint{display:none}.line{font-size:12px}.number{width:48px;padding-right:12px}.tab{padding:0 14px;font-size:12px}.position{padding:3px 8px}.status-file{padding:3px 8px}.mode{padding:3px 9px}.breadcrumbs{padding-left:12px}.tools{gap:0!important}}@media(prefers-reduced-motion:reduce){.glyph{transition:none}}

<script id="source-data" type="application/json">[{"path":"init.lua","sha":"2514f9ed90d831793ec8b5ca4666040996d01e09","source":"https://github.com/LazyVim/starter/blob/main/init.lua","content":"-- bootstrap lazy.nvim, LazyVim and your plugins\nrequire(\"config.lazy\")\n"},{"path":"lua/config/lazy.lua","sha":"d73bfa104703557f2cb466d9c89485ae1d4f7be0","source":"https://github.com/LazyVim/starter/blob/main/lua/config/lazy.lua","content":"local lazypath = vim.fn.stdpath(\"data\") .. \"/lazy/lazy.nvim\"\nif not (vim.uv or vim.loop).fs_stat(lazypath) then\n  local lazyrepo = \"https://github.com/folke/lazy.nvim.git\"\n  local out = vim.fn.system({ \"git\", \"clone\", \"--filter=blob:none\", \"--branch=stable\", lazyrepo, lazypath })\n  if vim.v.shell_error ~= 0 then\n    vim.api.nvim_echo({\n      { \"Failed to clone lazy.nvim:\\n\", \"ErrorMsg\" },\n      { out, \"WarningMsg\" },\n      { \"\\nPress any key to exit...\" },\n    }, true, {})\n    vim.fn.getchar()\n    os.exit(1)\n  end\nend\nvim.opt.rtp:prepend(lazypath)\n\nrequire(\"lazy\").setup({\n  spec = {\n    -- add LazyVim and import its plugins\n    { \"LazyVim/LazyVim\", import = \"lazyvim.plugins\" },\n    -- import/override with your plugins\n    { import = \"plugins\" },\n  },\n  defaults = {\n    -- By default, only LazyVim plugins will be lazy-loaded. Your custom plugins will load during startup.\n    -- If you know what you're doing, you can set this to `true` to have all your custom plugins lazy-loaded by default.\n    lazy = false,\n    -- It's recommended to leave version=false for now, since a lot the plugin that support versioning,\n    -- have outdated releases, which may break your Neovim install.\n    version = false, -- always use the latest git commit\n    -- version = \"*\", -- try installing the latest stable version for plugins that support semver\n  },\n  install = { colorscheme = { \"tokyonight\", \"habamax\" } },\n  checker = {\n    enabled = true, -- check for plugin updates periodically\n <script>
'use strict';
(()=>{
const files=JSON.parse(document.getElementById('source-data').textContent);
const app=document.getElementById('app'),editor=document.getElementById('editor'),code=document.getElementById('code'),search=document.getElementById('search');
let active=1,currentLine=1,query='',matches=[],matchIndex=-1;
const positions=new Map();
const escape=text=>text.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function glyphs(text){return Array.from(text,char=>'<span class="glyph" aria-hidden="true">'+escape(char)+'</span>').join('')}
function highlight(line){
if(active===2)return glyphs(line);
const pattern=/(--[^\n]*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(\d+)\b|\b(local|if|then|else|elseif|end|for|in|do|while|repeat|until|return|function|true|false|nil|not|and|or)\b|\b([A-Za-z_][\w.]*)(?=\s*\()/g;
let html='',offset=0;
for(const token of line.matchAll(pattern)){
html+=glyphs(line.slice(offset,token.index));
const style=token[1]?'comment':token[2]?'string':token[3]?'variable':token[4]?'keyword':'function';
html+='<span class="'+style+'">'+glyphs(token[0])+'</span>';offset=token.index+token[0].length;
}
return html+glyphs(line.slice(offset));
}
function updatePosition(){const total=files[active].content.trimEnd().split('\n').length;const percent=Math.min(100,Math.round((editor.scrollTop/(editor.scrollHeight-editor.clientHeight||1))*100));document.getElementById('position').textContent=currentLine+':1  '+(percent===0?'Top':percent===100?'Bot':percent+'%')+'  ≡ '+total}
function selectLine(number,scroll=false){currentLine=Math.max(1,Math.min(code.children.length,number));code.querySelector('.current')?.classList.remove('current');const row=code.children[currentLine-1];row?.classList.add('current');if(scroll)row?.scrollIntoView({block:'nearest',inline:'nearest'});updatePosition()}
function openFile(index){
positions.set(active,{scroll:editor.scrollTop,line:currentLine});active=index;query='';matches=[];closeSearch();
for(const button of document.querySelectorAll('[data-file]'))button.setAttribute('aria-selected',String(Number(button.dataset.file)===index));
editor.setAttribute('aria-labelledby','tab-'+index);
const file=files[index],lines=file.content.replace(/\n$/,'').split('\n');
code.innerHTML=lines.map((line,index)=>'<div class="line" data-line="'+(index+1)+'"><span class="number" aria-hidden="true">'+(index+1)+'</span><span class="text"><span class="sr-only">'+escape(line)+'</span><span aria-hidden="true">'+(highlight(line)||' ')+'</span>'+'</span></div>').join('');
document.getElementById('breadcrumbs').innerHTML='starter <span aria-hidden="true"> › </span> '+file.path.split('/').map(escape).join(' <span aria-hidden="true"> › </span> ');
document.getElementById('status-file').textContent=file.path.split('/').pop();document.getElementById('encoding').textContent='utf-8 · '+(index===2?'text':'lua');
const position=positions.get(index);editor.scrollTop=position?.scroll||0;selectLine(position?.line||1);if(innerWidth<=700)app.classList.remove('sidebar-open');
}
function closeSearch(){search.classList.add('hidden');document.getElementById('search-prefix').classList.add('hidden');document.getElementById('message').classList.remove('hidden');document.getElementById('search-result').textContent='';search.value=''}
function startSearch(){document.getElementById('message').classList.add('hidden');search.classList.remove('hidden');document.getElementById('search-prefix').classList.remove('hidden');search.focus()}
function findMatches(){query=search.value.toLowerCase();for(const row of code.children)row.classList.remove('match');matches=[];if(query){files[active].content.split('\n').forEach((line,index)=>{if(line.toLowerCase().includes(query))matches.push(index+1)})}matchIndex=-1;nextMatch();}
function nextMatch(){for(const row of code.children)row.classList.remove('match');if(matches.length){matchIndex=(matchIndex+1)%matches.length;selectLine(matches[matchIndex],true);code.children[currentLine-1].classList.add('match')}document.getElementById('search-result').textContent=query?(matches.length?(matchIndex+1)+'/'+matches.length:'No matches'):''}
document.querySelectorAll('[data-file]').forEach(button=>button.addEventListener('click',()=>openFile(Number(button.dataset.file))));
document.getElementById('files-toggle').addEventListener('click',event=>{if(innerWidth<=700){app.classList.toggle('sidebar-open');event.currentTarget.setAttribute('aria-expanded',String(app.classList.contains('sidebar-open')))}else{app.classList.toggle('sidebar-hidden');event.currentTarget.setAttribute('aria-expanded',String(!app.classList.contains('sidebar-hidden')))}});
document.getElementById('bin-toggle').addEventListener('click',event=>{const list=document.getElementById('bin-files');list.classList.toggle('hidden');event.currentTarget.setAttribute('aria-expanded',String(!list.classList.contains('hidden')));event.currentTarget.textContent=list.classList.contains('hidden')?'› ▱ lua / config':'⌄ ▱ lua / config'});
document.getElementById('find').addEventListener('click',startSearch);search.addEventListener('input',findMatches);search.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();nextMatch()}if(event.key==='Escape'){closeSearch();editor.focus()}});
editor.addEventListener('click',event=>{const row=event.target.closest('.line');if(row)selectLine(Number(row.dataset.line))});editor.addEventListener('scroll',updatePosition,{passive:true});
editor.addEventListener('keydown',event=>{if(event.key==='j'||event.key==='ArrowDown'){event.preventDefault();selectLine(currentLine+1,true)}if(event.key==='k'||event.key==='ArrowUp'){event.preventDefault();selectLine(currentLine-1,true)}if(event.key==='/'){event.preventDefault();startSearch()}if(event.key==='Escape'){closeSearch();for(const row of code.children)row.classList.remove('match')}});
document.querySelectorAll('[role="tab"]').forEach(tab=>tab.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const next=(Number(tab.dataset.file)+(event.key==='ArrowRight'?1:2))%files.length;openFile(next);document.getElementById('tab-'+next).focus()}}));
openFile(1);
})();
</script>
</body>
